<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーム試作ラボ</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#17233a;max-width:600px;margin:auto;padding:24px}h1{font-size:28px}a.card{display:block;padding:20px;margin:14px 0;border-radius:16px;background:white;color:inherit;text-decoration:none;box-shadow:0 3px 12px #15264b16}small{color:#65758d}.ready{color:#147d51;font-weight:bold}</style><h1>🎮 ゲーム試作ラボ</h1><p>iPhoneのSafariで遊べるHTML5ゲームのテストページです。</p><a class="card" href="01_number_merge/"><strong>① ナンバーマージ（2048）</strong><p>数字をスワイプして合体させよう</p><span class="ready">▶ プレイする</span></a><div id="others"></div><script>let names=['カラーソート','フルーツドロップ','ブロックブレイカー','ネオン回避','タワースタック','アイドル採掘','一筆ライン','スネークサバイバル','ジュエルチェイン'];document.querySelector('#others').innerHTML=names.map((n,i)=>'<div class="card" style="padding:20px;margin:14px 0;border-radius:16px;background:white"><strong>'+String(i+2).padStart(2,'0')+' '+n+'</strong><p><small>順次公開予定</small></p></div>').join('')</script>

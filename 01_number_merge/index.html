<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ナンバーマージ</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8ef;color:#776e65;font-family:system-ui,sans-serif;text-align:center;touch-action:pan-y}.wrap{max-width:480px;margin:auto;padding:18px}h1{font-size:38px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center}.scores{display:flex;gap:8px}.score{background:#bbada0;color:white;border-radius:6px;padding:8px 16px;font-weight:bold}.score small{display:block;font-size:11px}.actions{display:flex;gap:8px;justify-content:center;margin:16px}button{border:0;border-radius:6px;padding:12px 20px;background:#8f7a66;color:white;font-weight:bold;font-size:15px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:#bbada0;padding:9px;border-radius:9px;aspect-ratio:1;touch-action:none;user-select:none}.tile{border-radius:5px;display:grid;place-items:center;font-size:clamp(22px,8vw,40px);font-weight:800;background:#cdc1b4;color:#776e65}.tile[data-n="2"]{background:#eee4da}.tile[data-n="4"]{background:#ede0c8}.tile[data-n="8"]{background:#f2b179;color:white}.tile[data-n="16"]{background:#f59563;color:white}.tile[data-n="32"]{background:#f67c5f;color:white}.tile[data-n="64"]{background:#f65e3b;color:white}.tile[data-n="128"],.tile[data-n="256"],.tile[data-n="512"],.tile[data-n="1024"],.tile[data-n="2048"]{background:#edcf72;color:white;font-size:clamp(19px,6vw,32px)}p{line-height:1.6}a{color:#8f7a66}</style><div class="wrap"><div class="top"><h1>2048</h1><div class="scores"><div class="score"><small>SCORE</small><span id="score">0</span></div><div class="score"><small>BEST</small><span id="best">0</span></div></div></div><p>同じ数字を合体して2048を目指そう！</p><div id="board" class="board"></div><div class="actions"><button id="undo">1手戻す</button><button id="restart">最初から</button></div><p id="status" role="status">スワイプして移動</p><p><a href="../">ゲーム一覧へ戻る</a></p></div><script>const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),statusEl=document.querySelector('#status');let grid,score=0,history=null,won=false;let best=Number(localStorage.getItem('number-merge-best')||0);function spawn(){let empty=[];for(let i=0;i<16;i++)if(!grid[i])empty.push(i);if(empty.length){let i=empty[Math.floor(Math.random()*empty.length)];grid[i]=Math.random()<.9?2:4}}function render(){board.innerHTML=grid.map(n=>'<div class="tile" data-n="'+n+'">'+(n||'')+'</div>').join('');scoreEl.textContent=score;best=Math.max(score,best);bestEl.textContent=best;localStorage.setItem('number-merge-best',best)}function reset(){grid=Array(16).fill(0);score=0;history=null;won=false;spawn();spawn();statusEl.textContent='スワイプして移動';render()}function move(dir){let old=grid.slice(),before=score;for(let line=0;line<4;line++){let ids=[];for(let k=0;k<4;k++){let r=dir==='left'||dir==='right'?line:(dir==='up'?k:3-k),c=dir==='up'||dir==='down'?line:(dir==='left'?k:3-k);if(dir==='right')c=3-k;if(dir==='down')r=3-k;ids.push(r*4+c)}let vals=ids.map(i=>grid[i]).filter(Boolean),merged=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){let n=vals[i]*2;merged.push(n);score+=n;i++}else merged.push(vals[i])}ids.forEach((id,i)=>grid[id]=merged[i]||0)}if(grid.every((v,i)=>v===old[i]))return;history={grid:old,score:before};spawn();render();if(!won&&grid.includes(2048)){won=true;statusEl.textContent='2048達成！ 続けて遊べます'}else if(!canMove())statusEl.textContent='ゲームオーバー！ もう一度挑戦';else statusEl.textContent='ナイス！'}function canMove(){if(grid.includes(0))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=r*4+c;if(c<3&&grid[i]===grid[i+1]||r<3&&grid[i]===grid[i+4])return true}return false}let start=null;board.addEventListener('touchstart',e=>{start=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});board.addEventListener('touchend',e=>{if(!start)return;let dx=e.changedTouches[0].clientX-start[0],dy=e.changedTouches[0].clientY-start[1];start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});document.addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});document.querySelector('#undo').onclick=()=>{if(!history)return;grid=history.grid;score=history.score;history=null;statusEl.textContent='1手戻しました';render()};document.querySelector('#restart').onclick=()=>{if(confirm('最初からやり直しますか？'))reset()};reset();</script></html>

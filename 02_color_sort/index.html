<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カラーソート</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#edf2ff;color:#273354;text-align:center;margin:0}.wrap{max-width:500px;margin:auto;padding:22px 14px}h1{font-size:32px}a{color:#5064bc}p{color:#58678a}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 12px;justify-items:center;margin:28px 0}.tube{width:85px;height:150px;border:5px solid #8493b5;border-top:0;border-radius:0 0 18px 18px;display:flex;flex-direction:column-reverse;gap:3px;padding:4px;background:#fff9;touch-action:manipulation;transition:transform .12s}.tube.sel{transform:translateY(-12px);border-color:#3c5fe1}.ball{height:25%;border-radius:8px;border:2px solid #ffffff66}.actions{display:flex;justify-content:center;gap:9px}button{background:#536bcb;border:0;border-radius:10px;color:white;padding:12px;font-size:15px;font-weight:bold}.msg{min-height:45px;font-weight:bold;color:#5266a0}.stats{display:flex;justify-content:space-around;margin:20px}.tube.done{border-color:#26a679}</style><div class="wrap"><a href="../">‹ ゲーム一覧</a><h1>🧪 カラーソート</h1><p>同じ色を1本の試験管にまとめよう！</p><div class="stats"><b id="level">レベル 1</b><b>移動 <span id="moves">0</span>回</b></div><div class="board" id="board"></div><div class="msg" id="msg">試験管を2本、順番にタップ</div><div class="actions"><button id="undo">1手戻す</button><button id="reset">やり直す</button><button id="next">次の問題</button></div><p>上の色を空の試験管か同じ色の上へ移動できます。</p></div><script>
const colors=['#f36c79','#4cb2ee','#f5c65d','#9675e8','#4bc9a5','#ed904b'];
let tubes=[],original=[],selected=-1,history=[],moves=0,level=1;
const board=document.getElementById('board'),msg=document.getElementById('msg');
function copy(a){return a.map(x=>x.slice())}
function rand(n){return Math.floor(Math.random()*n)}
function puzzle(){let n=Math.min(4+Math.floor((level-1)/3),6);let t=Array.from({length:n},(_,i)=>Array(4).fill(i));t.push([],[]);for(let k=0;k<130;k++){let src=t.map((x,i)=>x.length?i:-1).filter(x=>x>=0);let i=src[rand(src.length)];let dest=t.map((x,j)=>j!==i&&x.length<4?j:-1).filter(x=>x>=0);if(dest.length)t[dest[rand(dest.length)]].push(t[i].pop())}return t}
function draw(){board.innerHTML='';tubes.forEach((t,i)=>{let b=document.createElement('div');b.className='tube'+(selected===i?' sel':'')+(t.length===4&&t.every(c=>c===t[0])?' done':'');b.setAttribute('role','button');b.setAttribute('aria-label','試験管 '+(i+1));b.onclick=()=>tap(i);t.forEach(c=>{let d=document.createElement('div');d.className='ball';d.style.background=colors[c];b.appendChild(d)});board.appendChild(b)});document.getElementById('moves').textContent=moves;document.getElementById('level').textContent='レベル '+level}
function start(){tubes=puzzle();original=copy(tubes);selected=-1;history=[];moves=0;msg.textContent='試験管を2本、順番にタップ';draw()}
function tap(i){if(selected<0){if(!tubes[i].length)return;selected=i;msg.textContent='移動先を選んでください';draw();return}if(selected===i){selected=-1;draw();return}let a=tubes[selected],b=tubes[i];if(b.length===4||(b.length&&b[b.length-1]!==a[a.length-1])){selected=b.length?i:-1;msg.textContent='同じ色か空の試験管を選んでください';draw();return}history.push({t:copy(tubes),m:moves});b.push(a.pop());moves++;selected=-1;msg.textContent='いい感じ！';draw();if(tubes.every(x=>!x.length||(x.length===4&&x.every(c=>c===x[0]))))msg.textContent='🎉 クリア！ 次の問題へ！'}
document.getElementById('undo').onclick=()=>{let p=history.pop();if(p){tubes=p.t;moves=p.m;selected=-1;msg.textContent='1手戻しました';draw()}};
document.getElementById('reset').onclick=()=>{tubes=copy(original);history=[];moves=0;selected=-1;msg.textContent='やり直し！';draw()};
document.getElementById('next').onclick=()=>{level++;start()};
start();</script></html>
